apiVersion: openchoreo.dev/v1alpha1
kind: ComponentType
metadata:
  name: adversarial-overbudget
  namespace: default
spec:
  workloadType: deployment
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        list:
          type: array
          items:
            type: string
  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: test
        spec:
          replicas: 1
          template:
            metadata:
              labels:
                app: test
            spec:
              containers:
                - name: app
                  image: test:latest
                  command: ${parameters.list.map(x, x)}
